<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Gem Quest</title>
<style>
:root{
  --bg1:#1d2b53; --bg2:#0f1733; --card:#fff8e7; --ink:#2b2140; --muted:#6b5f80;
  --gold:#f7c948; --gold2:#e0a400; --gem:#22d3ee; --ok:#22c55e; --bad:#ef4444;
  --r:18px; --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35);
  --font:"Trebuchet MS","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}
.big{font-size:clamp(18px,3.4vmin,26px);font-weight:800;padding:.7em 1.4em;border-radius:999px;box-shadow:var(--shadow);transition:transform .08s}
.big:active{transform:translateY(3px)}
.gold{background:linear-gradient(#ffe27a,var(--gold));color:#5a3b00}
.mint{background:linear-gradient(#8ff0b4,#3ccf7c);color:#08381c}
.plain{background:#fff;color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:grid;place-items:center}
.iconbtn.off{opacity:.45}
/* ---------- title ---------- */
#title{flex-direction:column;align-items:center;justify-content:center;gap:2.2vmin;text-align:center;color:#fff}
#title h1{margin:0;font-size:clamp(40px,11vmin,96px);letter-spacing:.02em;color:var(--gold);text-shadow:0 5px 0 #8a5a00,0 10px 24px rgba(0,0,0,.5)}
#title .sub{font-size:clamp(15px,3.2vmin,24px);opacity:.9;max-width:34em;padding:0 16px}
#title .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.floaty{font-size:clamp(34px,8vmin,64px);animation:bob 2.4s ease-in-out infinite;display:inline-block}
.floaty:nth-child(2){animation-delay:.4s}.floaty:nth-child(3){animation-delay:.8s}.floaty:nth-child(4){animation-delay:1.2s}.floaty:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
/* ---------- setup ---------- */
#setup{flex-direction:column;align-items:center;overflow:auto;color:#fff}
#setup h2{margin:14px 0 4px;color:var(--gold);font-size:clamp(22px,5vmin,36px)}
#setup .hint{opacity:.8;font-size:14px;margin-bottom:8px;text-align:center;padding:0 12px}
#plist{display:flex;flex-direction:column;gap:10px;width:min(760px,96vw)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);color:var(--ink);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);border-left:10px solid var(--pc)}
.prow .av{width:58px;height:58px;border-radius:50%;font-size:34px;display:grid;place-items:center;background:var(--pc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.prow input{font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid #e6dcc4;background:#fff;width:100%;min-width:0;color:var(--ink)}
.prow .del{width:40px;height:40px;border-radius:50%;background:#f1e6cc;color:#7a5a2a;font-size:20px}
.levels{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{padding:9px 4px;border-radius:12px;background:#efe5cc;color:#5a4a2a;font-weight:800;font-size:clamp(13px,2.6vmin,16px);line-height:1.15}
.levels button small{display:block;font-weight:600;opacity:.8;font-size:.8em}
.levels button.on{background:var(--pc);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.setupbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin:14px 0 22px}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px}
.seg button{background:none;color:#fff;font-weight:800;padding:9px 14px;border-radius:999px;font-size:15px}
.seg button.on{background:var(--gold);color:#5a3b00}
/* ---------- game ---------- */
#game{display:none;grid-template-columns:1fr minmax(240px,30%);gap:0}
#game.active{display:grid}
#boardWrap{position:relative;min-width:0;min-height:0;padding:8px}
#board{width:100%;height:100%;display:block}
#panel{display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0;overflow:auto;background:rgba(0,0,0,.18)}
#turnCard{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);text-align:center;border-top:10px solid var(--pc,#ccc)}
#turnName{font-size:clamp(18px,3.4vmin,26px);font-weight:900;margin:2px 0}
#turnLevel{font-size:13px;color:var(--muted);font-weight:700}
#diceRow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.die{width:64px;height:64px;border-radius:14px;background:#fff;box-shadow:inset 0 -5px 0 #ddd,0 4px 10px rgba(0,0,0,.25);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;gap:2px}
.die i{width:12px;height:12px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die.roll{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-20deg)}40%{transform:rotate(18deg)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
#rollBtn:disabled{filter:grayscale(1);opacity:.5}
#scores{display:flex;flex-direction:column;gap:8px}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;border-left:8px solid var(--pc);transition:transform .2s}
.sc.now{transform:scale(1.03);box-shadow:0 0 0 3px var(--gold)}
.sc .av{font-size:26px}
.sc .nm{font-weight:900;font-size:16px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .lv{font-size:11px;color:var(--muted);font-weight:700}
.sc .tr{font-weight:900;font-size:15px;text-align:right;white-space:nowrap}
.sc .tot{font-size:12px;color:var(--muted);font-weight:800}
#topbar{display:flex;gap:8px;justify-content:flex-end}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.6);padding:12px;z-index:20}
#modal.show{display:flex}
#qcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);width:min(760px,100%);max-height:100%;overflow:auto;padding:0 0 16px;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#qhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:24px 24px 0 0;color:#fff;font-weight:900;font-size:clamp(15px,3vmin,20px)}
#qhead .who{margin-left:auto;font-size:.85em;opacity:.95}
#qhead .say{background:rgba(255,255,255,.25);color:#fff;border-radius:10px;width:42px;height:38px;font-size:20px}
#qtext{font-size:clamp(20px,4.4vmin,34px);font-weight:900;text-align:center;padding:14px 16px 6px;line-height:1.25}
#qpic{text-align:center;font-size:clamp(40px,10vmin,80px);line-height:1.1;padding:0 12px 6px;word-break:break-all}
#qpic.small{font-size:clamp(28px,6vmin,46px);letter-spacing:.06em}
#qpic svg{width:clamp(80px,20vmin,150px);height:clamp(80px,20vmin,150px)}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
#choices button{background:#fff;border:4px solid #e9dcbc;border-radius:16px;padding:14px 10px;font-size:clamp(17px,3.6vmin,26px);font-weight:800;color:var(--ink);min-height:62px;box-shadow:0 4px 0 #e0d0aa}
#choices button:active{transform:translateY(2px)}
#choices button.right{background:#d8ffe2;border-color:var(--ok)}
#choices button.wrong{background:#ffe1e1;border-color:var(--bad);animation:no .35s}
#choices button.dim{opacity:.45}
#choices.little button{font-size:clamp(22px,5vmin,36px)}
@keyframes no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#qmsg{text-align:center;font-size:clamp(18px,3.8vmin,28px);font-weight:900;min-height:1.3em;padding:6px 12px}
#qmsg .sub{display:block;font-size:.7em;color:var(--muted);font-weight:700}
#qnext{display:none;margin:4px auto 0}
#qnext.show{display:block}
/* ---------- end ---------- */
#end{flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:12px;overflow:auto}
#end h2{font-size:clamp(30px,8vmin,64px);margin:6px 0;color:var(--gold);text-shadow:0 4px 0 #8a5a00}
#podium{display:flex;align-items:flex-end;gap:12px;justify-content:center;flex-wrap:wrap}
.pod{background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;min-width:120px;box-shadow:var(--shadow);border-top:10px solid var(--pc)}
.pod .av{font-size:42px}.pod .nm{font-weight:900;font-size:18px}.pod .pts{font-weight:900;font-size:22px}
.pod.first{transform:translateY(-14px) scale(1.08)}
.pod .place{font-size:28px}
.fly{position:fixed;z-index:50;font-size:34px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-0.4,.6,1),opacity .8s}
.confetti{position:fixed;width:9px;height:14px;z-index:40;pointer-events:none;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (orientation:portrait){
  #game.active{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #board{height:auto}
  #panel{position:relative}
  #topbar{position:absolute;top:10px;right:10px;flex-direction:column;z-index:2}
  #turnCard{margin-right:54px}
  #scores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .sc{grid-template-columns:auto minmax(0,1fr);row-gap:0}
  .sc .tr{grid-column:1/-1;text-align:left;font-size:14px}
  .sc .tr .tot{display:inline;margin-left:6px}
}
@media (max-height:520px){
  #qhead{padding:6px 12px} #qtext{padding:8px 12px 2px;font-size:clamp(17px,4.6vmin,24px)} #qpic{font-size:34px;padding-bottom:2px} #qpic.small{font-size:24px} #qpic svg{width:64px;height:64px}
  #choices{gap:8px;padding:4px 12px} #choices button{min-height:44px;padding:8px;font-size:18px} #choices.little button{font-size:22px}
  #qmsg{padding:2px 12px;font-size:17px} #qcard{padding-bottom:8px} #qnext{padding:.45em 1.2em}
}
@media (max-width:520px){ #choices{grid-template-columns:1fr} #choices.little{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>
<body>

<section id="title" class="screen active">
  <div><span class="floaty">💎</span><span class="floaty">🪙</span><span class="floaty">🏰</span><span class="floaty">🪙</span><span class="floaty">💎</span></div>
  <h1>Gem Quest</h1>
  <div class="sub">Race along the treasure trail, answer questions, and collect the most coins and gems! For 1 to 6 players. Everyone picks their own level.</div>
  <div class="row">
    <button class="big gold" id="newBtn">▶ New Game</button>
    <button class="big mint" id="contBtn" hidden>⏯ Keep Playing</button>
  </div>
</section>

<section id="setup" class="screen">
  <h2>Who is playing?</h2>
  <div class="hint">Tap the animal to change it. Pick a level for each player.</div>
  <div id="plist"></div>
  <div class="setupbar">
    <button class="big plain" id="addBtn">＋ Add player</button>
    <div class="seg" id="lenSeg"><button data-len="0">Short</button><button data-len="1">Medium</button><button data-len="2">Long</button></div>
  </div>
  <div class="setupbar" style="margin-top:0">
    <button class="big plain" id="backBtn">◀ Back</button>
    <button class="big gold" id="startBtn">Start! ▶</button>
  </div>
</section>

<section id="game" class="screen">
  <div id="boardWrap"><svg id="board" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" aria-label="Game board"></svg></div>
  <div id="panel">
    <div id="topbar"><button class="iconbtn" id="voiceBtn" title="Read aloud">🔊</button><button class="iconbtn" id="soundBtn" title="Sound">🎵</button><button class="iconbtn" id="menuBtn" title="Menu">🏠</button></div>
    <div id="turnCard">
      <div id="turnName"></div><div id="turnLevel"></div>
      <div id="diceRow"><div class="die" id="die"></div><button class="big gold" id="rollBtn">Roll!</button></div>
      <div id="turnMsg" style="min-height:1.2em;font-weight:800;margin-top:6px;color:var(--muted)"></div>
    </div>
    <div id="scores"></div>
  </div>
</section>

<section id="end" class="screen">
  <div><span class="floaty">🏆</span></div>
  <h2 id="endTitle">Treasure Time!</h2>
  <div id="podium"></div>
  <div class="row" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px">
    <button class="big gold" id="againBtn">Play Again</button>
    <button class="big plain" id="homeBtn">Change Players</button>
  </div>
</section>

<div id="modal"><div id="qcard">
  <div id="qhead"><span id="qcat"></span><span class="who" id="qwho"></span><button class="say" id="qsay" aria-label="Read it again">🔊</button></div>
  <div id="qtext"></div><div id="qpic"></div>
  <div id="choices"></div>
  <div id="qmsg"></div>
  <button class="big gold" id="qnext">Next ▶</button>
</div></div>

<script>
(function(){
"use strict";
/* =====================================================================
   Gem Quest: a pass-and-play treasure board game for 1-6 players.
   Each player picks a level: Little (ages 4-6), Kid (ages 8-12) or Adult.
   Land on a space, answer a question at your own level, collect coins
   and gems. A gem is worth 5 coins. Most treasure at the end wins.
   ===================================================================== */
const $=s=>document.querySelector(s);
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt=n=>n.toLocaleString('en-US');
const FAST=()=>!!window.__GQfast;
const wait=ms=>FAST()?Promise.resolve():new Promise(r=>setTimeout(r,ms));

/* ---------------- levels and categories ---------------- */
const LEVELS=[
  {key:'little',name:'Little',ages:'Ages 4–6',icon:'🐣',nch:3},
  {key:'kid',name:'Kid',ages:'Ages 8–12',icon:'🚀',nch:4},
  {key:'adult',name:'Adult',ages:'Grown-ups',icon:'🎓',nch:4},
];
const CATS={
  math:{name:'Math',icon:'➕',color:'#3b82f6'},
  words:{name:'Words',icon:'🔤',color:'#16a34a'},
  science:{name:'Science',icon:'🔬',color:'#9333ea'},
  world:{name:'World',icon:'🌍',color:'#ea580c'},
  fun:{name:'Fun Facts',icon:'⭐',color:'#db2777'},
};
const CAT_KEYS=Object.keys(CATS);

/* ---------------- question helpers ---------------- */
// A question: {q, pic, choices:[...], ans, say}
function mk(q,correct,wrongs,extra){
  const ch=shuffle([correct].concat(wrongs));
  return Object.assign({q,choices:ch.map(String),ans:ch.indexOf(correct)},extra||{});
}
function numWrongs(ans,n,min=0,spread){
  const s=spread||Math.max(2,Math.round(Math.abs(ans)*0.15));
  // round answers get round wrong choices (120 minutes vs 100, 130, 180)
  if(ans>=40&&ans%10===0){ const out=shuffle([ans+10,ans-10,ans+20,ans-20,ans+30,ans+60,ans-30]).filter(v=>v>=min&&v!==ans); return out.slice(0,n); }
  // mostly near misses, with a farther one mixed in for bigger numbers
  const near=shuffle([ans+1,ans-1,ans+2,ans-2]).slice(0,s<=1?4:rint(1,2)), mid=shuffle([ans+s,ans-s,ans+3,ans-3]), far=s<=1?[]:shuffle([ans+10,ans-10,ans*2,Math.round(ans/2)]);
  const cands=near.concat(mid,far).filter(v=>v>=min&&v!==ans&&Number.isInteger(v));
  const out=[]; for(const v of cands) if(!out.includes(v)&&out.length<n) out.push(v);
  let k=1; while(out.length<n){ const v=ans+k*(k%2?1:-1)*3+k; if(v>=min&&v!==ans&&!out.includes(v)) out.push(v); k++; }
  return out;
}
const NAMES=['Ava','Leo','Mia','Sam','Zoe','Max','Lily','Ben'];
// bank entry: [question, correct, wrong1, wrong2, wrong3?, picture?]
function fromBank(entry,nch){
  const [q,a,...rest]=entry; let pic=null;
  const wr=rest.filter(x=>{ if(x&&typeof x==='object'){ pic=x.pic; return false; } return true; });
  return mk(q,a,shuffle(wr).slice(0,nch-1),pic?{pic}:{});
}

/* ---------------- LITTLE (ages 4-6) ---------------- */
const L_THINGS=['🍎','⭐','🐞','🐟','🎈','🍓','🚗','🦆','🌸','🍪'];
const L_WORDS=[['A','APPLE','🍎'],['B','BALL','⚽'],['C','CAT','🐱'],['D','DOG','🐶'],['E','EGG','🥚'],['F','FISH','🐟'],['G','GOAT','🐐'],['H','HAT','🎩'],['K','KITE','🪁'],['L','LION','🦁'],['M','MOON','🌙'],['N','NOSE','👃'],['O','OCTOPUS','🐙'],['P','PIG','🐷'],['Q','QUEEN','👸'],['R','RABBIT','🐰'],['S','SUN','☀️'],['T','TREE','🌳'],['U','UMBRELLA','☂️'],['V','VAN','🚐'],['W','WHALE','🐳'],['Z','ZEBRA','🦓'],['J','JUICE','🧃'],['I','ICE CREAM','🍦']];
const L_RHYME=[['CAT','🐱','HAT',['DOG','SUN']],['BEE','🐝','TREE',['CAR','FISH']],['FROG','🐸','LOG',['BALL','CAKE']],['CAKE','🎂','SNAKE',['DOOR','PIG']],['MOON','🌙','SPOON',['BOAT','HAT']],['BEAR','🐻','CHAIR',['DOG','MILK']],['STAR','⭐','CAR',['FISH','BED']],['FISH','🐟','DISH',['TREE','SOCK']],['BOAT','⛵','GOAT',['CAT','BELL']],['KING','🤴','RING',['DUCK','HAT']],['BED','🛏️','RED',['SUN','CUP']],['DUCK','🦆','TRUCK',['MOON','BALL']],['MOUSE','🐭','HOUSE',['TREE','CAR']],['DOG','🐶','FROG',['CAKE','SHOE']]];
const L_OPP=[['HOT','COLD',['BIG','FAST']],['BIG','SMALL',['HAPPY','WET']],['UP','DOWN',['HOT','RED']],['DAY','NIGHT',['CAT','TALL']],['HAPPY','SAD',['SLOW','UP']],['FAST','SLOW',['COLD','DOG']],['WET','DRY',['BIG','GO']],['OPEN','CLOSED',['SOFT','DAY']],['FULL','EMPTY',['HOT','LOUD']],['LOUD','QUIET',['UP','BIG']],['STOP','GO',['SAD','WET']],['TALL','SHORT',['HAPPY','DRY']]];
const L_SCI=[
 ['Which animal says MOO?','Cow','Dog','Duck',{pic:'🐄'}],['Which one can fly?','Bird','Fish','Cat',{pic:'🪽'}],['Which animal lives in the water?','Fish','Horse','Dog',{pic:'🌊'}],
 ['What do plants need to grow?','Water and sun','Candy','Toys',{pic:'🌱'}],['What do bees make?','Honey','Milk','Bread',{pic:'🐝'}],['Which animal has a long trunk?','Elephant','Giraffe','Lion',{pic:'🐘'}],
 ['Which animal has a very long neck?','Giraffe','Pig','Frog',{pic:'🦒'}],['What do caterpillars turn into?','Butterflies','Fish','Birds',{pic:'🐛'}],['What falls from clouds when it rains?','Water','Rocks','Leaves',{pic:'🌧️'}],
 ['What do we use to see?','Eyes','Ears','Toes',{pic:'👀'}],['What do we use to hear?','Ears','Eyes','Knees',{pic:'👂'}],['What do we use to smell?','Nose','Elbow','Feet',{pic:'👃'}],
 ['A puppy is a baby what?','Dog','Cat','Horse',{pic:'🐶'}],['A kitten is a baby what?','Cat','Dog','Duck',{pic:'🐱'}],['A chick hatches from an…','Egg','Apple','Box',{pic:'🐣'}],
 ['Which season has snow?','Winter','Summer','Spring',{pic:'⛄'}],['When do we see the moon and stars?','At night','At lunch','At breakfast',{pic:'🌙'}],['Which animal hops?','Kangaroo','Snake','Fish',{pic:'🦘'}],
 ['Which animal says QUACK?','Duck','Cow','Sheep',{pic:'🦆'}],['Which one is a fruit?','Banana','Rock','Shoe',{pic:'🍌'}],['Which one is a vegetable?','Carrot','Cookie','Candy',{pic:'🥕'}],
 ['What does a frog say?','Ribbit','Moo','Woof',{pic:'🐸'}],['How many legs does a dog have?','4','2','6',{pic:'🐕'}],['How many legs does a bird have?','2','4','6',{pic:'🐦'}],
 ['How many legs does a spider have?','8','4','2',{pic:'🕷️'}],['Which animal has stripes?','Zebra','Pig','Frog',{pic:'🦓'}],['What do we breathe?','Air','Sand','Juice',{pic:'💨'}],
 ['Ice is very…','Cold','Hot','Sticky',{pic:'🧊'}],['Where does a bird live?','In a nest','In a cave','In a shoe',{pic:'🐦'}],['Which animal sleeps all winter?','Bear','Cow','Duck',{pic:'🐻'}],

const GEN={little:LITTLE,kid:KID,adult:ADULT};
function question(level,cat){
  // avoid repeats within a game
  const used=G&&G.used?(G.used[level+cat]=G.used[level+cat]||[]):[];
  let q;
  for(let tries=0;tries<25;tries++){ q=GEN[level][cat](); if(!used.includes(q.q+'|'+q.choices[q.ans])) break; }
  used.push(q.q+'|'+q.choices[q.ans]); if(used.length>60) used.shift();
  q.cat=cat; return q;
}

let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f1,f2,dur,type='triangle',vol=0.08,delay=0){
  if(!AC||!S.sound) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}
const arp=(fs,step,type,vol,len)=>fs.forEach((f,i)=>tone(f,0,len||0.12,type||'triangle',vol||0.08,i*step));

function renderSetup(){
  const box=$('#plist'); box.innerHTML='';
  S.players.forEach((p,i)=>{
    const row=document.createElement('div'); row.className='prow'; row.style.setProperty('--pc',COLORS[i]);
    row.innerHTML=`<button class="av" aria-label="Change animal">${p.avatar}</button><input maxlength="12" placeholder="Player ${i+1} name" value="${(p.name||'').replace(/"/g,'&quot;')}"><button class="del" aria-label="Remove player" ${S.players.length<2?'disabled style="visibility:hidden"':''}>✕</button>

const LENGTHS=[28,40,52];
function buildSpaces(n){
  const sp=[];
  for(let i=0;i<n;i++){
    let type='cat', cat=CAT_KEYS[(i*3)%5];
    if(i===0) type='start'; else if(i===n-1) type='castle';
    else if(i%5===0) type='gem';
    else if(i%9===4) type='lucky';
    else if(i%11===7&&i<n-5) type='whoosh';
    else if(i%13===10) type='chest';
    sp.push({type,cat});
  }
  return sp;
}
function layout(n){
  const rows=n<=30?4:5, per=Math.ceil(n/rows), pts=[];
  const x0=80, x1=920, y0=560, y1=70;
  for(let i=0;i<n;i++){
    const r=Math.floor(i/per), c=i%per, inRow=Math.min(per,n-r*per);
    const span=(x1-x0)*(inRow-1)/(per-1||1);
    let x=x0+(per>1?c*(x1-x0)/(per-1):0); if(r%2) x=x1-(per>1?c*(x1-x0)/(per-1):0);
    const y=y0-r*(y0-y1)/(rows-1);
    pts.push({x,y:y+Math.sin(c*0.9+r)*10});
    void span;
  }
  return {pts,rows,per,r:Math.min(30,(x1-x0)/(per-1)*0.36)};
}

  svg.innerHTML=h;
  const tg=svg.querySelector('#tokens');
  G.players.forEach((pl,i)=>{ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','tok'); g.dataset.i=i; g.style.transition='transform .22s ease-out';
    g.innerHTML=`<circle r="${L.r*0.72}" fill="${pl.color}" stroke="#fff" stroke-width="4"/><text y="${L.r*0.27}" font-size="${L.r*0.8}" text-anchor="middle">${pl.avatar}</text>`; tg.appendChild(g); });
  placeTokens();
}
function tokenXY(i){
  const pl=G.players[i], p=G.L.pts[pl.pos], same=G.players.map((q,k)=>k).filter(k=>G.players[k].pos===pl.pos), idx=same.indexOf(i), n=same.length;
  if(n===1) return {x:p.x,y:p.y-G.L.r*0.9};
  const a=-Math.PI/2+(idx-(n-1)/2)*0.75; return {x:p.x+Math.cos(a)*G.L.r*0.95,y:p.y+Math.sin(a)*G.L.r*0.95-G.L.r*0.4};
}
function placeTokens(){
  document.querySelectorAll('#tokens .tok').forEach(g=>{ const i=+g.dataset.i, {x,y}=tokenXY(i); g.style.transform=`translate(${x}px,${y}px) scale(${i===G.turn?1.15:1})`; });
  const cur=document.querySelector(`#tokens .tok[data-i="${G.turn}"]`); if(cur) cur.parentNode.appendChild(cur);
}

/* ---------------- game flow ---------------- */
function newGame(){
  const ps=S.players.map((p,i)=>({name:(p.name||'').trim()||('Player '+(i+1)),avatar:p.avatar,level:p.level,color:COLORS[i],pos:0,coins:0,gems:0,done:false,right:0,asked:0}));
  const n=LENGTHS[S.len]; G={players:ps,turn:0,round:1,spaces:buildSpaces(n),n,finisher:null,over:false,used:{}};
  S.game=G; save(); show('game'); startTurn();
  say(`Let's find treasure! ${ps[0].name} goes first.`);
}
const score=p=>p.coins+p.gems*5;
function renderScores(){
  const box=$('#scores'); box.innerHTML='';
  G.players.forEach((p,i)=>{ const d=document.createElement('div'); d.className='sc'+(i===G.turn&&!G.over?' now':''); d.style.setProperty('--pc',p.color); d.id='sc'+i;
    d.innerHTML=`<div class="av">${p.avatar}</div><div><div class="nm">${esc(p.name)}${p.done?' 🏰':''}</div><div class="lv">${LEVELS[p.level].icon} ${LEVELS[p.level].name}</div></div><div class="tr">🪙 ${p.coins} &nbsp;💎 ${p.gems}<div class="tot">${score(p)} pts</div></div>`;
    box.appendChild(d); });
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setDie(n){ const on={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[n]||[]; $('#die').innerHTML=Array.from({length:9},(_,k)=>`<i style="visibility:${on.includes(k)?'visible':'hidden'}"></i>`).join(''); }
let busy=false;
function startTurn(){
  if(!G) return;
  if(!G.L){ G.L=layout(G.n); }
  drawBoard(); renderScores(); busy=false;
  const p=G.players[G.turn];
  $('#turnCard').style.setProperty('--pc',p.color);
  $('#turnName').textContent=`${p.avatar} ${p.name}'s turn`;
  $('#turnLevel').textContent=`${LEVELS[p.level].icon} ${LEVELS[p.level].name} level · Round ${G.round}`;
  $('#turnMsg').textContent=G.finisher!==null?'Last round! Grab more treasure!':'Tap Roll!';
  $('#rollBtn').disabled=false; setDie(0);
  S.game=G; save();
}
$('#rollBtn').onclick=()=>{ audio(); roll(); };
async function roll(force){
  if(busy||!G||G.over) return; busy=true; $('#rollBtn').disabled=true; hush();
  const p=G.players[G.turn], n=force||rint(1,6);
  sfx('roll'); $('#die').classList.remove('roll'); void $('#die').offsetWidth; $('#die').classList.add('roll');
  for(let k=0;k<6&&!FAST();k++){ setDie(rint(1,6)); await wait(70); }
  setDie(n); $('#turnMsg').textContent=`You rolled ${n}!`; say(`${n}!`);
  await wait(450);
  await moveBy(p,n);
  await landOn(p);
}
async function moveBy(p,n){
  for(let k=0;k<n&&p.pos<G.n-1;k++){ p.pos++; placeTokens(); sfx('hop'); await wait(260); }
}
async function landOn(p){
  const s=G.spaces[p.pos], lv=LEVELS[p.level].key;
  if(s.type==='castle') return reachCastle(p);
  if(s.type==='cat') return ask(p,question(lv,s.cat),{coins:3});
  if(s.type==='gem') return ask(p,question(lv,pick(CAT_KEYS)),{gems:1});
  if(s.type==='lucky'){ give(p,{coins:2}); return message('🍀 Lucky clover!',`${p.name} finds 2 coins!`,'#65a30d'); }
  if(s.type==='chest'){ const r=Math.random()<0.4?{gems:1}:{coins:rint(3,5)}; give(p,r); return message('🎁 Treasure chest!',r.gems?`${p.name} finds a GEM!`:`${p.name} finds ${r.coins} coins!`,'#b45309'); }
  if(s.type==='whoosh'){ sfx('whoosh'); const to=Math.min(G.n-2,p.pos+3); while(p.pos<to){ p.pos++; placeTokens(); await wait(120); } return message('🌀 Whoosh!',`${p.name} zooms ahead 3 spaces!`,'#0ea5e9'); }
  endTurn();
}
function give(p,r){
  if(r.coins){ p.coins+=r.coins; flyTo(p,'🪙',Math.min(r.coins,5)); sfx('coin'); }
  if(r.gems){ p.gems+=r.gems; flyTo(p,'💎',r.gems); setTimeout(()=>sfx('gem'),120); }
  renderScores();
}
function flyTo(p,emo,count){
  if(FAST()) return; const idx=G.players.indexOf(p), tgt=document.getElementById('sc'+idx); if(!tgt) return;
  const tr=tgt.getBoundingClientRect(), from=($('#modal').classList.contains('show')?$('#qmsg'):$('#turnCard')).getBoundingClientRect();
  for(let k=0;k<count;k++){ const e=document.createElement('div'); e.className='fly'; e.textContent=emo; e.style.left=(from.left+from.width/2-17+(k-count/2)*14)+'px'; e.style.top=(from.top+from.height/2-17)+'px'; document.body.appendChild(e);
    setTimeout(()=>{ e.style.transform=`translate(${tr.left+tr.width-60-parseFloat(e.style.left)}px,${tr.top+tr.height/2-17-parseFloat(e.style.top)}px) scale(.6)`; e.style.opacity='0.2'; },30+k*90);
    setTimeout(()=>e.remove(),1000+k*90); }
}
function confetti(n=60){ if(FAST()) return; const cs=['#f7c948','#22d3ee','#ef4444','#22c55e','#a855f7','#fff']; for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'vw'; c.style.background=pick(cs); c.style.animationDuration=(1.6+Math.random()*1.6)+'s'; c.style.animationDelay=Math.random()*0.4+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3600); } }

/* ---------------- question card ---------------- */
let Q=null;
function picHTML(pic){
  if(!pic) return '';
  if(typeof pic==='string') return esc(pic);
  if(pic.rows) return esc(pic.rows);
  if(pic.color) return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="${pic.color}" stroke="#333" stroke-width="3"/></svg>`;
  if(pic.shape){ const c=pic.color, st='stroke="#333" stroke-width="3"'; const sh={
    CIRCLE:`<circle cx="50" cy="50" r="42" fill="${c}" ${st}/>`, SQUARE:`<rect x="12" y="12" width="76" height="76" fill="${c}" ${st}/>`, RECTANGLE:`<rect x="4" y="26" width="92" height="48" fill="${c}" ${st}/>`,
    TRIANGLE:`<polygon points="50,8 94,88 6,88" fill="${c}" ${st}/>`, STAR:`<polygon points="50,5 61,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 39,38" fill="${c}" ${st}/>`,
    HEART:`<path d="M50 88 C10 60 4 34 22 20 C36 10 48 18 50 30 C52 18 64 10 78 20 C96 34 90 60 50 88Z" fill="${c}" ${st}/>`}[pic.shape];
    return `<svg viewBox="0 0 100 100">${sh}</svg>`; }
  return '';
}
function ask(p,q,reward){
  return new Promise(res=>{
    Q={p,q,reward,res,done:false,tries:0};
    const lv=LEVELS[p.level], c=CATS[q.cat], gem=!!reward.gems;
    $('#qhead').style.background=gem?'linear-gradient(90deg,#0891b2,#06b6d4)':c.color;
    $('#qcat').textContent=(gem?'💎 GEM QUESTION · ':'')+c.icon+' '+c.name;
    $('#qwho').textContent=`${p.avatar} ${p.name} · ${lv.name}`;
    $('#qtext').textContent=q.q;
    const ph=picHTML(q.pic); $('#qpic').innerHTML=ph; $('#qpic').style.display=ph?'':'none'; $('#qpic').classList.toggle('small',!!(q.pic&&q.pic.rows));
    const box=$('#choices'); box.className=p.level===0?'little':''; box.innerHTML='';
    q.choices.forEach((ch,i)=>{ const b=document.createElement('button'); b.textContent=ch; b.onclick=()=>answer(i); box.appendChild(b); });
    $('#qmsg').innerHTML=gem?'Get it right to win a 💎 gem!':'Get it right to win 3 🪙 coins!';
    $('#qnext').classList.remove('show');
    $('#modal').classList.add('show');
    readQ();
  });
}
function readQ(){ if(!Q) return; const q=Q.q; const txt=(q.say||q.q).replace(/___/g,'blank').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/²/g,' squared ');
  say(Q.p.level===0?`${txt} ${q.choices.slice(0,-1).join(', ')}, or ${q.choices[q.choices.length-1]}?`:txt); }
$('#qsay').onclick=()=>{ audio(); const was=S.voice; S.voice=true; readQ(); S.voice=was; };
function answer(i){
  if(!Q||Q.done) return; audio();
  const btns=[...document.querySelectorAll('#choices button')], q=Q.q, p=Q.p;
  Q.done=true; p.asked++;
  btns.forEach((b,k)=>{ if(k===q.ans) b.classList.add('right'); else if(k===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  if(i===q.ans){
    p.right++; sfx('right'); confetti(Q.reward.gems?90:40);
    const m=pick(['Great job!','You got it!','Awesome!','Super smart!','Brilliant!']);
    $('#qmsg').innerHTML=`${m} ${Q.reward.gems?'+1 💎':'+3 🪙'}`; say(m); give(p,Q.reward);
  } else {
    sfx('wrong');
    const right=q.choices[q.ans];
    if(p.level===0){ $('#qmsg').innerHTML=`Good try! The answer is <b>${esc(right)}</b>.<span class="sub">+1 🪙 for trying!</span>`; give(p,{coins:1}); say(`Good try! The answer is ${right}. Here is a coin for trying!`); }
    else { $('#qmsg').innerHTML=`Not quite. The answer is <b>${esc(right)}</b>.`; say(`Not quite. The answer is ${right}.`); }
  }
  $('#qnext').classList.add('show');
}
$('#qnext').onclick=()=>{ audio(); sfx('click'); closeQ(); };
function closeQ(){ if(!Q) return; const r=Q.res; Q=null; hush(); $('#modal').classList.remove('show'); r(); endTurn(); }
function message(title,text,color){
  return new Promise(res=>{
    Q={p:G.players[G.turn],q:null,reward:{},res,done:true};
    $('#qhead').style.background=color; $('#qcat').textContent=title; $('#qwho').textContent='';
    $('#qtext').textContent=text; $('#qpic').innerHTML=''; $('#qpic').style.display='none'; $('#choices').innerHTML=''; $('#qmsg').innerHTML='';
    $('#qnext').classList.add('show'); $('#modal').classList.add('show'); say(text);
  });
}
function reachCastle(p){
  p.done=true;
  let r, t;
  if(G.finisher===null){ G.finisher=G.turn; r={gems:2,coins:5}; t=`${p.name} reached the castle FIRST! +2 💎 and 5 🪙! Everyone else gets one last turn.`; sfx('fanfare'); confetti(120); }
  else { r={gems:1}; t=`${p.name} made it to the castle! +1 💎`; sfx('right'); confetti(50); }
  give(p,r); renderScores();
  return message('🏰 The Castle!',t,'#7c3aed');
}
function endTurn(){
  if(!G||G.over) return;
  const n=G.players.length;
  // after someone reaches the castle, finish the round so everyone gets the same number of turns
  let next=G.turn, wrapped=false;
  for(let k=0;k<n;k++){
    next=(next+1)%n; if(next===0) wrapped=true;
    if(G.finisher!==null&&wrapped) return finish();
    if(!G.players[next].done) break;
    if(k===n-1) return finish();
  }
  if(G.players.every(p=>p.done)) return finish();
  if(wrapped) G.round++;
  G.turn=next; startTurn();
}
function finish(){
  G.over=true; S.game=null; save(); hush();
  const ranked=G.players.slice().sort((a,b)=>score(b)-score(a)||b.gems-a.gems);
  const top=score(ranked[0]), winners=ranked.filter(p=>score(p)===top);
  $('#endTitle').textContent=winners.length>1?'It\'s a tie!':`${ranked[0].name} wins!`;
  const medal=['🥇','🥈','🥉','🏅','🏅','🏅'];
  let place=0; $('#podium').innerHTML=ranked.map((p,i)=>{ if(i&&score(p)<score(ranked[i-1])) place=i; return `<div class="pod ${place===0?'first':''}" style="--pc:${p.color}"><div class="place">${medal[place]}</div><div class="av">${p.avatar}</div><div class="nm">${esc(p.name)}</div><div>🪙 ${p.coins} · 💎 ${p.gems}</div><div class="pts">${score(p)} pts</div><div style="font-size:12px;color:var(--muted);font-weight:700">${p.right} of ${p.asked} right</div></div>`; }).join('');
  show('end'); sfx('fanfare'); confetti(150);
  say(winners.length>1?`It's a tie! Great playing, everyone!`:`${ranked[0].name} wins with ${top} points! Great playing, everyone!`);
}
$('#againBtn').onclick=()=>{ audio(); newGame(); };
$('#homeBtn').onclick=()=>{ renderSetup(); show('setup'); };
$('#menuBtn').onclick=()=>{ hush(); S.game=G; save(); refreshTitle(); show('title'); };
function syncToggles(){ $('#voiceBtn').classList.toggle('off',!S.voice); $('#soundBtn').classList.toggle('off',!S.sound); }
$('#voiceBtn').onclick=()=>{ S.voice=!S.voice; if(!S.voice) hush(); syncToggles(); save(); };
$('#soundBtn').onclick=()=>{ S.sound=!S.sound; syncToggles(); save(); audio(); sfx('click'); };
syncToggles(); refreshTitle();
window.addEventListener('resize',()=>{ if(G&&$('#game').classList.contains('active')) placeTokens(); });

// test hook for automated play-testing (harmless in normal play)
window.__GQ={GEN,LEVELS,CATS,question,get G(){return G;},newGame,roll,answer,closeQ,get Q(){return Q;},S,save,renderSetup,show,score,buildSpaces,layout};
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

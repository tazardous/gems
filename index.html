<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Gem Quest Adventure</title>
<style>
:root{
  --bg1:#1d2b53; --bg2:#0f1733; --card:#fff8e7; --ink:#2b2140; --muted:#6b5f80;
  --gold:#f7c948; --ok:#22c55e; --bad:#ef4444;
  --r:18px; --shadow:0 6px 0 rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.35);
  --font:"Trebuchet MS","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --s:min(15vh,74px);
  --l:calc(12px + env(safe-area-inset-left,0px)); --rr:calc(12px + env(safe-area-inset-right,0px)); --b:calc(10px + env(safe-area-inset-bottom,0px));
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}
.big{font-size:clamp(18px,3.4vmin,26px);font-weight:800;padding:.65em 1.4em;border-radius:999px;box-shadow:var(--shadow);transition:transform .08s}
.big:active{transform:translateY(3px)}
.gold{background:linear-gradient(#ffe27a,var(--gold));color:#5a3b00}
.mint{background:linear-gradient(#8ff0b4,#3ccf7c);color:#08381c}
.plain{background:#fff;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.center{flex-direction:column;align-items:center;justify-content:center;gap:2vmin;text-align:center;color:#fff;overflow:auto}
h1{margin:0;font-size:clamp(38px,10vmin,90px);color:var(--gold);text-shadow:0 5px 0 #8a5a00,0 10px 24px rgba(0,0,0,.5);line-height:1}
h2{margin:6px 0;color:var(--gold);font-size:clamp(24px,6vmin,46px);text-shadow:0 3px 0 #8a5a00}
.sub{font-size:clamp(15px,3.2vmin,22px);opacity:.92;max-width:36em;padding:0 16px}
.floaty{font-size:clamp(30px,7vmin,58px);animation:bob 2.4s ease-in-out infinite;display:inline-block}
.floaty:nth-child(2){animation-delay:.4s}.floaty:nth-child(3){animation-delay:.8s}.floaty:nth-child(4){animation-delay:1.2s}.floaty:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.card{background:var(--card);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 18px}
img.hero{image-rendering:pixelated;width:64px;height:96px}
/* setup */
#setup{flex-direction:column;align-items:center;overflow:auto;color:#fff}
#plist{display:flex;flex-direction:column;gap:10px;width:min(780px,96vw)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--card);color:var(--ink);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);border-left:10px solid var(--pc)}
.prow .av{width:62px;height:76px;border-radius:14px;display:grid;place-items:center;background:var(--pc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);padding:0}
.prow .av img{width:42px;height:63px;image-rendering:pixelated}
.prow input{font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid #e6dcc4;background:#fff;width:100%;min-width:0;color:var(--ink)}
.prow .del{width:40px;height:40px;border-radius:50%;background:#f1e6cc;color:#7a5a2a;font-size:20px}
.levels{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.levels button{padding:9px 4px;border-radius:12px;background:#efe5cc;color:#5a4a2a;font-weight:800;font-size:clamp(13px,2.6vmin,16px);line-height:1.15}
.levels button small{display:block;font-weight:600;opacity:.8;font-size:.8em}
.levels button.on{background:var(--pc);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
/* turn / result / standings */
.lvlchip{display:inline-block;background:rgba(255,255,255,.15);border-radius:999px;padding:6px 14px;font-weight:800;font-size:clamp(14px,2.8vmin,18px)}
.turnhero{display:flex;align-items:center;gap:16px;justify-content:center}
.turnhero img{width:72px;height:108px;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
.stat{display:flex;gap:18px;justify-content:center;font-size:clamp(20px,4.4vmin,32px);font-weight:900}
table.stand{border-collapse:separate;border-spacing:0 6px;margin:0 auto;font-size:clamp(15px,3vmin,20px)}
table.stand td{background:var(--card);color:var(--ink);padding:6px 12px;font-weight:800}
table.stand td:first-child{border-radius:12px 0 0 12px;border-left:8px solid var(--pc)}
table.stand td:last-child{border-radius:0 12px 12px 0}
table.stand img{width:20px;height:30px;image-rendering:pixelated;vertical-align:middle}
#podium{display:flex;align-items:flex-end;gap:12px;justify-content:center;flex-wrap:wrap}
.pod{background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;min-width:120px;box-shadow:var(--shadow);border-top:10px solid var(--pc)}
.pod img{width:40px;height:60px;image-rendering:pixelated}.pod .nm{font-weight:900;font-size:18px}.pod .pts{font-weight:900;font-size:22px}.pod .place{font-size:28px}
.pod.first{transform:translateY(-14px) scale(1.08)}
/* play */
#play{display:none;place-items:center;background:#000}
#play.active{display:grid}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.tb{position:fixed;width:var(--s);height:var(--s);border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2);color:#fff;font:800 calc(var(--s)*0.3)/1 var(--font);display:grid;place-items:center;touch-action:none;padding:0;z-index:5}
.tb.on{background:rgba(255,221,0,.55);border-color:#ffdd00}
#tL{left:var(--l);bottom:calc(var(--b) + 26px)}
#tR{left:calc(var(--l) + var(--s)*1.25);bottom:calc(var(--b) + 26px)}
#tJ{right:var(--rr);bottom:calc(var(--b) + 20px);width:calc(var(--s)*1.45);height:calc(var(--s)*1.45);font-size:calc(var(--s)*0.26)}
#tP{right:var(--rr);top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px;font-size:16px}
#tM{right:calc(var(--rr) + 54px);top:calc(10px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:12px;font-size:18px}
#touch[hidden]{display:none}
/* question modal + pause */
#modal,#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.6);padding:12px;z-index:20}
#modal.show,#pause.show{display:flex}
#qcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);width:min(760px,100%);max-height:100%;overflow:auto;padding:0 0 14px;animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#qhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:24px 24px 0 0;color:#fff;font-weight:900;font-size:clamp(15px,3vmin,20px)}
#qhead .who{margin-left:auto;font-size:.85em}
#qhead .say{background:rgba(255,255,255,.25);color:#fff;border-radius:10px;width:42px;height:38px;font-size:20px}
#qtext{font-size:clamp(20px,4.4vmin,34px);font-weight:900;text-align:center;padding:14px 16px 6px;line-height:1.25}
#qpic{text-align:center;font-size:clamp(40px,10vmin,80px);line-height:1.1;padding:0 12px 6px;word-break:break-all}
#qpic.small{font-size:clamp(28px,6vmin,46px);letter-spacing:.06em}
#qpic svg{width:clamp(80px,20vmin,150px);height:clamp(80px,20vmin,150px)}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
#choices button{background:#fff;border:4px solid #e9dcbc;border-radius:16px;padding:14px 10px;font-size:clamp(17px,3.6vmin,26px);font-weight:800;color:var(--ink);min-height:62px;box-shadow:0 4px 0 #e0d0aa}
#choices button.right{background:#d8ffe2;border-color:var(--ok)}
#choices button.wrong{background:#ffe1e1;border-color:var(--bad);animation:no .35s}
#choices button.dim{opacity:.45}
#choices.little button{font-size:clamp(22px,5vmin,36px)}
@keyframes no{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#qmsg{text-align:center;font-size:clamp(18px,3.8vmin,28px);font-weight:900;min-height:1.3em;padding:6px 12px}
#qmsg .sub{display:block;font-size:.7em;color:var(--muted);font-weight:700}
#qnext{display:none;margin:4px auto 0}
#qnext.show{display:block}
#pause .card{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:260px}
.confetti{position:fixed;width:9px;height:14px;z-index:40;pointer-events:none;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-height:520px){
  #qhead{padding:6px 12px} #qtext{padding:8px 12px 2px;font-size:clamp(17px,4.6vmin,24px)} #qpic{font-size:34px;padding-bottom:2px} #qpic.small{font-size:24px} #qpic svg{width:64px;height:64px}
  #choices{gap:8px;padding:4px 12px} #choices button{min-height:44px;padding:8px;font-size:18px} #choices.little button{font-size:22px}
  #qmsg{padding:2px 12px;font-size:17px} #qcard{padding-bottom:8px} #qnext{padding:.45em 1.2em}
  .center{gap:1vmin} .turnhero img{width:52px;height:78px}
}
@media (max-width:520px){ #choices{grid-template-columns:1fr} #choices.little{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>
<body>

<section id="title" class="screen center active">
  <div><span class="floaty">🪙</span><span class="floaty">💎</span><span class="floaty">🐙</span><span class="floaty">💎</span><span class="floaty">🪙</span></div>
  <h1>Gem Quest</h1>
  <div class="lvlchip">⚔️ ADVENTURE</div>
  <div class="sub">Run, jump and answer questions through 6 levels. Collect coins, then gems, then face the Big Octopus! For 1 to 6 players taking turns.</div>
  <div class="row"><button class="big gold" id="newBtn" data-primary>▶ New Adventure</button><button class="big mint" id="contBtn" hidden>⏯ Keep Playing</button></div>
</section>

<section id="setup" class="screen">
  <h2 style="margin-top:12px">Who is playing?</h2>
  <div class="sub" style="font-size:14px;margin-bottom:8px">Tap the hero to change it. Pick a level for each player.</div>
  <div id="plist"></div>
  <div class="row" style="margin:14px 0 22px">
    <button class="big plain" id="addBtn">＋ Add player</button>
    <button class="big plain" id="backBtn">◀ Back</button>
    <button class="big gold" id="startBtn">Start! ▶</button>
  </div>
</section>

<section id="turn" class="screen center">
  <div class="lvlchip" id="turnLvl"></div>
  <h2 id="turnPlace"></h2>
  <div class="turnhero card"><img id="turnImg" alt=""><div style="text-align:left"><div style="font-size:clamp(22px,5vmin,36px);font-weight:900" id="turnName"></div><div style="color:var(--muted);font-weight:800" id="turnAge"></div></div></div>
  <div class="sub" id="turnGoal"></div>
  <div class="sub" id="turnPass" style="font-size:15px;opacity:.75"></div>
  <button class="big gold" id="goBtn" data-primary>GO! ▶</button>
</section>

<section id="result" class="screen center">
  <h2 id="resTitle"></h2>
  <div class="card" style="min-width:min(420px,92vw)">
    <div class="stat" id="resStat"></div>
    <div style="font-weight:800;color:var(--muted);margin-top:6px" id="resQ"></div>
    <div style="font-weight:800;margin-top:6px" id="resTotal"></div>
  </div>
  <button class="big gold" id="resBtn" data-primary>Next ▶</button>
</section>

<section id="standings" class="screen center">
  <h2 id="stTitle"></h2>
  <table class="stand" id="stTable"></table>
  <div class="row"><button class="big gold" id="stBtn" data-primary>Next Level ▶</button></div>
</section>

<section id="end" class="screen center">
  <div><span class="floaty">🏆</span></div>
  <h2 id="endTitle"></h2>
  <div id="podium"></div>
  <div class="row" style="margin-top:10px"><button class="big gold" id="againBtn" data-primary>Play Again</button><button class="big plain" id="homeBtn">Change Players</button></div>
</section>

<section id="play" class="screen"><canvas id="cv" aria-label="Gem Quest adventure"></canvas></section>
<div id="touch" hidden>
  <button class="tb" id="tL" data-k="left" aria-label="Left">◀</button>
  <button class="tb" id="tR" data-k="right" aria-label="Right">▶</button>
  <button class="tb" id="tJ" data-k="jump" aria-label="Jump">JUMP</button>
  <button class="tb" id="tP" data-k="pause" aria-label="Pause">II</button>
  <button class="tb" id="tM" data-k="mute" aria-label="Sound">♪</button>
</div>

<div id="modal"><div id="qcard">
  <div id="qhead"><span id="qcat"></span><span class="who" id="qwho"></span><button class="say" id="qsay" aria-label="Read it again">🔊</button></div>
  <div id="qtext"></div><div id="qpic"></div>
  <div id="choices"></div>
  <div id="qmsg"></div>
  <button class="big gold" id="qnext">Next ▶</button>
</div></div>
<div id="pause"><div class="card">
  <h2 style="color:var(--ink);text-shadow:none">Paused</h2>
  <button class="big mint" id="pKeep">Keep playing</button>
  <button class="big plain" id="pRestart">Start level over</button>
  <button class="big plain" id="pQuit">Save and quit</button>
</div></div>

<script>
(function(){
"use strict";
/* =====================================================================
   Gem Quest Adventure
   Up to 6 players take turns through 6 levels. Levels 1-3: collect
   coins. Levels 4-6: collect gems. Level 6 adds small sea creatures and
   the Big Octopus (one eye blind, crossed out with an X).
   Wise Owl gates ask each player a question at their own age level.
   Everything (characters, art, levels, music) is original.
   ===================================================================== */
const $=s=>document.querySelector(s);
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>n.toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- age levels (picked per player) ---------------- */
const AGES=[
  {key:'little',name:'Little',ages:'Ages 4–6',icon:'🐣',nch:3,dbl:true,float:true,hearts:0,stones:true,spd:0.6,bossHp:2,note:'No hearts to lose. Double jump, and hold JUMP to float.'},
  {key:'kid',name:'Kid',ages:'Ages 8–12',icon:'🚀',nch:4,dbl:true,float:false,hearts:3,stones:false,spd:0.85,bossHp:3,note:'3 hearts. Double jump.'},
  {key:'adult',name:'Adult',ages:'Grown-ups',icon:'🎓',nch:4,dbl:false,float:false,hearts:3,stones:false,spd:1.15,bossHp:4,note:'3 hearts. Single jump. Faster creatures.'},
];
const CATS={
  math:{name:'Math',icon:'➕',color:'#3b82f6'}, words:{name:'Words',icon:'🔤',color:'#16a34a'}, science:{name:'Science',icon:'🔬',color:'#9333ea'},
  world:{name:'World',icon:'🌍',color:'#ea580c'}, fun:{name:'Fun Facts',icon:'⭐',color:'#db2777'},
};
const CAT_KEYS=Object.keys(CATS);

/* ---------------- question helpers ---------------- */
// A question: {q, pic, choices:[...], ans, say}
function mk(q,correct,wrongs,extra){
  const ch=shuffle([correct].concat(wrongs));
  return Object.assign({q,choices:ch.map(String),ans:ch.indexOf(correct)},extra||{});
}
function numWrongs(ans,n,min=0,spread){
  const s=spread||Math.max(2,Math.round(Math.abs(ans)*0.15));
  // round answers get round wrong choices (120 minutes vs 100, 130, 180)
  if(ans>=40&&ans%10===0){ const out=shuffle([ans+10,ans-10,ans+20,ans-20,ans+30,ans+60,ans-30]).filter(v=>v>=min&&v!==ans); return out.slice(0,n); }
  // mostly near misses, with a farther one mixed in for bigger numbers
  const near=shuffle([ans+1,ans-1,ans+2,ans-2]).slice(0,s<=1?4:rint(1,2)), mid=shuffle([ans+s,ans-s,ans+3,ans-3]), far=s<=1?[]:shuffle([ans+10,ans-10,ans*2,Math.round(ans/2)]);
  const cands=near.concat(mid,far).filter(v=>v>=min&&v!==ans&&Number.isInteger(v));
  const out=[]; for(const v of cands) if(!out.includes(v)&&out.length<n) out.push(v);
  let k=1; while(out.length<n){ const v=ans+k*(k%2?1:-1)*3+k; if(v>=min&&v!==ans&&!out.includes(v)) out.push(v); k++; }
  return out;
}
const NAMES=['Ava','Leo','Mia','Sam','Zoe','Max','Lily','Ben'];
// bank entry: [question, correct, wrong1, wrong2, wrong3?, picture?]
function fromBank(entry,nch){
  const [q,a,...rest]=entry; let pic=null;
  const wr=rest.filter(x=>{ if(x&&typeof x==='object'){ pic=x.pic; return false; } return true; });
  return mk(q,a,shuffle(wr).slice(0,nch-1),pic?{pic}:{});
}

/* ---------------- LITTLE (ages 4-6) ---------------- */
const L_THINGS=['🍎','⭐','🐞','🐟','🎈','🍓','🚗','🦆','🌸','🍪'];
const L_WORDS=[['A','APPLE','🍎'],['B','BALL','⚽'],['C','CAT','🐱'],['D','DOG','🐶'],['E','EGG','🥚'],['F','FISH','🐟'],['G','GOAT','🐐'],['H','HAT','🎩'],['K','KITE','🪁'],['L','LION','🦁'],['M','MOON','🌙'],['N','NOSE','👃'],['O','OCTOPUS','🐙'],['P','PIG','🐷'],['Q','QUEEN','👸'],['R','RABBIT','🐰'],['S','SUN','☀️'],['T','TREE','🌳'],['U','UMBRELLA','☂️'],['V','VAN','🚐'],['W','WHALE','🐳'],['Z','ZEBRA','🦓'],['J','JUICE','🧃'],['I','ICE CREAM','🍦']];
const L_RHYME=[['CAT','🐱','HAT',['DOG','SUN']],['BEE','🐝','TREE',['CAR','FISH']],['FROG','🐸','LOG',['BALL','CAKE']],['CAKE','🎂','SNAKE',['DOOR','PIG']],['MOON','🌙','SPOON',['BOAT','HAT']],['BEAR','🐻','CHAIR',['DOG','MILK']],['STAR','⭐','CAR',['FISH','BED']],['FISH','🐟','DISH',['TREE','SOCK']],['BOAT','⛵','GOAT',['CAT','BELL']],['KING','🤴','RING',['DUCK','HAT']],['BED','🛏️','RED',['SUN','CUP']],['DUCK','🦆','TRUCK',['MOON','BALL']],['MOUSE','🐭','HOUSE',['TREE','CAR']],['DOG','🐶','FROG',['CAKE','SHOE']]];
const L_OPP=[['HOT','COLD',['BIG','FAST']],['BIG','SMALL',['HAPPY','WET']],['UP','DOWN',['HOT','RED']],['DAY','NIGHT',['CAT','TALL']],['HAPPY','SAD',['SLOW','UP']],['FAST','SLOW',['COLD','DOG']],['WET','DRY',['BIG','GO']],['OPEN','CLOSED',['SOFT','DAY']],['FULL','EMPTY',['HOT','LOUD']],['LOUD','QUIET',['UP','BIG']],['STOP','GO',['SAD','WET']],['TALL','SHORT',['HAPPY','DRY']]];
const L_SCI=[
 ['Which animal says MOO?','Cow','Dog','Duck',{pic:'🐄'}],['Which one can fly?','Bird','Fish','Cat',{pic:'🪽'}],['Which animal lives in the water?','Fish','Horse','Dog',{pic:'🌊'}],
 ['What do plants need to grow?','Water and sun','Candy','Toys',{pic:'🌱'}],['What do bees make?','Honey','Milk','Bread',{pic:'🐝'}],['Which animal has a long trunk?','Elephant','Giraffe','Lion',{pic:'🐘'}],
 ['Which animal has a very long neck?','Giraffe','Pig','Frog',{pic:'🦒'}],['What do caterpillars turn into?','Butterflies','Fish','Birds',{pic:'🐛'}],['What falls from clouds when it rains?','Water','Rocks','Leaves',{pic:'🌧️'}],
 ['What do we use to see?','Eyes','Ears','Toes',{pic:'👀'}],['What do we use to hear?','Ears','Eyes','Knees',{pic:'👂'}],['What do we use to smell?','Nose','Elbow','Feet',{pic:'👃'}],
 ['A puppy is a baby what?','Dog','Cat','Horse',{pic:'🐶'}],['A kitten is a baby what?','Cat','Dog','Duck',{pic:'🐱'}],['A chick hatches from an…','Egg','Apple','Box',{pic:'🐣'}],

let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function tone(f1,f2,dur,type='square',vol=0.08,delay=0){
  if(!AC||!S.sound) return; const t0=AC.currentTime+delay, o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  v.gain.setValueAtTime(vol,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(AC.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol=0.12,freq=900){ if(!AC||!S.sound) return; const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=AC.createBufferSource(), v=AC.createGain(), f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq; s.buffer=b; v.gain.value=vol; s.connect(f).connect(v).connect(AC.destination); s.start(); }
const arp=(fs,step,type='square',vol=0.07,len=0.08)=>fs.forEach((f,i)=>tone(f,0,len,type,vol,i*step));

const NOTE_I={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteFreq(n){ const m=/^([A-G])([#b]?)(\d)$/.exec(n); if(!m) return 0; const i=NOTE_I[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,(12*(+m[3]+1)+i-69)/12); }
function parseSeq(str){ const out=[]; let pos=0; for(const tok of str.split(/[\s|]+/)){ if(!tok) continue; const [n,l]=tok.split(':'); const len=+l||2; out.push({f:n==='R'?0:noteFreq(n),at:pos,len}); pos+=len; } return {notes:out,len:pos}; }
for(const k in TUNES){ TUNES[k].L=parseSeq(TUNES[k].lead); TUNES[k].B=parseSeq(TUNES[k].bass); }
let music={name:null,next:0,timer:null,gain:null};
function playNote(f,t0,dur,type,vol){ if(!f) return; const o=AC.createOscillator(), v=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t0); v.gain.setValueAtTime(0.0001,t0); v.gain.linearRampToValueAtTime(vol,t0+0.008); v.gain.setValueAtTime(vol,t0+Math.max(0.01,dur*0.7)); v.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(v).connect(music.gain); o.start(t0); o.stop(t0+dur+0.03); }
function scheduleMusic(){ const tn=TUNES[music.name]; if(!tn||!AC||!music.gain) return; const st=60/tn.bpm/4, loop=tn.L.len*st;
  while(music.next<AC.currentTime+0.25){ const ls=music.next; for(const n of tn.L.notes){ const t0=ls+n.at*st, d=n.len*st*0.92; playNote(n.f,t0,d,tn.wave||'square',0.032); if(tn.echo) playNote(n.f,t0+st*1.5,d,'triangle',0.012); } for(const n of tn.B.notes) playNote(n.f,ls+n.at*st,n.len*st*0.8,'triangle',0.07); music.next+=loop; } }
function setMusic(name){
  if(!S.sound||!AC) name=null; if(music.name===name&&(name===null||music.timer)) return;
  if(music.gain){ const old=music.gain; try{ old.gain.setTargetAtTime(0,AC.currentTime,0.05); setTimeout(()=>old.disconnect(),400); }catch(e){} music.gain=null; }
  clearInterval(music.timer); music.timer=null; music.name=name; if(!name) return;
  music.gain=AC.createGain(); music.gain.gain.value=0.5; music.gain.connect(AC.destination); music.next=AC.currentTime+0.12; scheduleMusic(); music.timer=setInterval(scheduleMusic,60);
}

/* ---------------- turns ---------------- */
const score=p=>p.coins+p.gems*5;
function newAdventure(){
  A={players:S.players.map((p,i)=>({name:(p.name||'').trim()||('Player '+(i+1)),hero:p.hero,age:p.age,color:COLORS[i],coins:0,gems:0,right:0,asked:0,lv:[]})),lvl:0,turn:0,over:false};
  S.adv=A; save(); showTurn();
}
function showTurn(){
  const p=A.players[A.turn], L=LEVELS[A.lvl], ag=AGES[p.age];
  $('#turnLvl').textContent=`LEVEL ${A.lvl+1} OF 6 · ${L.treasure==='coin'?'🪙 COINS':'💎 GEMS'}`;
  $('#turnPlace').textContent=L.name;
  $('#turnImg').src=HEROES[p.hero].img; $('#turnName').textContent=p.name; $('#turnAge').textContent=`${ag.icon} ${ag.name} · ${ag.ages}`;
  $('#turnGoal').textContent=(L.boss?'Collect gems, answer the Wise Owl, and jump on the Big Octopus\'s head to get past him! ':`Collect ${L.treasure==='coin'?'coins':'gems'}, answer the Wise Owl's questions, and reach the treasure chest! `)+ag.note;
  $('#turnPass').textContent=A.players.length>1?`Pass the phone to ${p.name}!`:'';
  show('turn'); S.adv=A; save(); setMusic(null);
  say(`Level ${A.lvl+1}, ${L.name}! ${p.name}, it's your turn!`);
}
$('#goBtn').onclick=()=>{ audio(); startRun(); };
function startRun(){ const p=A.players[A.turn]; loadLevel(A.lvl,p); state='play'; show('play'); banner={txt:LEVELS[A.lvl].boss?'GET PAST THE BIG OCTOPUS TO REACH THE TREASURE!':`COLLECT ${LEVELS[A.lvl].treasure==='coin'?'COINS':'GEMS'} AND REACH THE TREASURE CHEST!`,until:t+260}; }
function finishRun(){
  const p=A.players[A.turn], r=RUN;
  p.coins+=r.coins; p.gems+=r.gems; p.right+=r.right; p.asked+=r.asked; p.lv[A.lvl]={coins:r.coins,gems:r.gems};
  hush(); setMusic(null); sfx('win');
  $('#resTitle').textContent=`${p.name} finished ${LEVELS[A.lvl].name}!`;
  $('#resStat').innerHTML=`<span>🪙 ${r.coins}</span><span>💎 ${r.gems}</span>`;
  $('#resQ').textContent=r.asked?`Wise Owl questions: ${r.right} of ${r.asked} right`:'';
  $('#resTotal').textContent=`Total treasure: ${score(p)} points`;
  const last=A.turn===A.players.length-1;
  $('#resBtn').textContent=last?(A.lvl===5?'See who won! ▶':'See standings ▶'):`${A.players[A.turn+1].name}'s turn ▶`;
  show('result'); confetti(60); say(`Great job, ${p.name}! You got ${r.coins} coins${r.gems?` and ${r.gems} gems`:''}!`);
  A.turn++; if(A.turn>=A.players.length){ A.turn=0; A.lvl++; A.standings=true; }
  if(A.lvl>=6) A.over=true;
  S.adv=A.over?null:A; save();
}
$('#resBtn').onclick=()=>{ audio(); sfx('menu'); if(A.over) return showEnd(); if(A.standings){ A.standings=false; return showStandings(); } showTurn(); };
function rankTable(){ const ranked=A.players.slice().sort((a,b)=>score(b)-score(a)); return ranked.map((p,i)=>`<tr style="--pc:${p.color}"><td>${i+1}.</td><td><img src="${HEROES[p.hero].img}" alt=""> ${esc(p.name)}</td><td>🪙 ${p.coins}</td><td>💎 ${p.gems}</td><td>${score(p)} pts</td></tr>`).join(''); }
function showStandings(){ $('#stTitle').textContent=`After Level ${A.lvl}`; $('#stTable').innerHTML=rankTable(); $('#stBtn').textContent=`Level ${A.lvl+1}: ${LEVELS[A.lvl].name} ▶`; show('standings'); S.adv=A; save(); }
$('#stBtn').onclick=()=>{ audio(); showTurn(); };
function showEnd(){
  const ranked=A.players.slice().sort((a,b)=>score(b)-score(a)||b.gems-a.gems), top=score(ranked[0]), tie=ranked.filter(p=>score(p)===top).length>1;
  $('#endTitle').textContent=tie?'It\'s a tie!':`${ranked[0].name} wins!`;
  const medal=['🥇','🥈','🥉','🏅','🏅','🏅']; let place=0;
  $('#podium').innerHTML=ranked.map((p,i)=>{ if(i&&score(p)<score(ranked[i-1])) place=i; return `<div class="pod ${place===0?'first':''}" style="--pc:${p.color}"><div class="place">${medal[place]}</div><img src="${HEROES[p.hero].img}" alt=""><div class="nm">${esc(p.name)}</div><div>🪙 ${p.coins} · 💎 ${p.gems}</div><div class="pts">${score(p)} pts</div><div style="font-size:12px;color:var(--muted);font-weight:700">${p.right} of ${p.asked} questions right</div></div>`; }).join('');
  show('end'); sfx('win'); confetti(150); S.adv=null; save();
  say(tie?'It\'s a tie! What a great adventure!':`${ranked[0].name} wins with ${top} points! What a great adventure!`);
}

/* ---------------- level state ---------------- */

const P={x:0,y:0,w:10,h:22,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,inv:0,spawnX:0,spawnY:0,dbl:false,sx:1,sy:1,hp:3,wasGround:true,fallV:0,mover:null};
function loadLevel(i,player){
  lvl=i; const L=LEVELS[i], H=11, W=L.W, top=8; AG=AGES[player.age]; HERO=HEROES[player.hero];
  const tl=Array.from({length:H},()=>Array(W).fill(' '));
  const inPit=x=>L.pits.some(([px,pw])=>x>=px&&x<px+pw);
  for(let x=0;x<W;x++) if(!inPit(x)) for(let y=top;y<H;y++) tl[y][x]='#';
  for(const [a,b,r] of L.plats) for(let x=a;x<=b;x++) if(tl[r][x]===' ') tl[r][x]='=';
  if(AG.stones) for(const [px,pw,m] of L.pits) if(!m) tl[7][px+Math.floor((pw-1)/2)]='=';
  const gates=L.gates.map((tx,n)=>({tx,n,open:false}));
  for(const gt of gates) for(let y=0;y<top;y++){ tl[y][gt.tx]='G'; tl[y][gt.tx+1]='G'; }
  let boss=null;
  if(L.boss){ for(let y=0;y<top;y++){ tl[y][L.boss.wall]='W'; tl[y][L.boss.wall+1]='W'; }
    boss={x:(L.boss.wall-6)*T,base:top*T,hp:AG.bossHp,max:AG.bossHp,state:'sleep',st:0,inv:0,arena:L.boss.arena*T,sweep:0,sweepLen:0,ink:[],cd:120,bob:0}; }
  const movers=L.pits.filter(p=>p[2]).map(([px,pw])=>({x0:px*T,x1:(px+pw-3)*T,x:px*T,y:top*T,w:3*T,ph:Math.random()*6,dx:0}));
  // treasure: on platforms, in arcs over pits, along the ground and over the rafts
  const tr=[], near=x=>L.gates.some(gx=>x>=gx-3&&x<=gx+4)||(L.boss&&x>=L.boss.arena-1);
  const free=(x,y)=>{ const tx=Math.floor(x/T), ty=Math.floor(y/T); return tl[ty]&&tl[ty][tx]===' '&&!tr.some(o=>Math.abs(o.x-x)<8&&Math.abs(o.y-y)<8); };
  const add=(x,y)=>{ if(!near(Math.floor(x/T))&&free(x,y)) tr.push({x,y,w:10,h:12,got:false,ph:Math.random()*6,c:rint(0,4)}); };
  for(const [a,b,r] of L.plats) for(let x=a;x<=b;x++) add(x*T+3,(r-1)*T+3);
  for(const [px,pw,m] of L.pits){ if(m){ for(let k=1;k<pw-1;k++) add((px+k)*T+3,6*T+3); } else { add(px*T+3,5*T+3); add((px+pw/2)*T-5,4*T+6); add((px+pw-1)*T+3,5*T+3); } }
  for(let x=5;x<W-7;x+=6) if(!inPit(x)&&!inPit(x+2)) for(let k=0;k<3;k++) add((x+k)*T+3,(top-1)*T+3);

  const treasure=kind==='gem'?tr.filter((o,k)=>k%2===0):tr;
  LV={W,H,top,t:tl,gates,boss,movers,treasure,kind,ice:!!L.ice,
    pitCols:new Set(Array.from({length:W},(_,x)=>x).filter(inPit)),
    crits:L.crits.filter(c=>c[2]<=player.age).map(([tx,k])=>mkCrit(tx,k,top)),
    springs:L.springs.map(tx=>({x:tx*T+1,y:top*T-9,w:13,h:9,squash:0})),

  RUN={coins:0,gems:0,right:0,asked:0}; hist=[]; parts=[]; texts=[]; shake=0; toast=null;
  camX=0;
}
function mkCrit(tx,k,top){
  const sp=AG.spd;
  if(k==='crab') return {k,x:tx*T,y:top*T-13,w:18,h:13,vx:(Math.random()<0.5?-1:1)*0.6*sp,ox:tx*T,alive:true,st:'walk',ft:0,vy:0};
  if(k==='jelly') return {k,x:tx*T,y:5*T,w:12,h:16,oy:4*T+4,vx:0,ox:tx*T,alive:true,st:'walk',ft:0,ph:Math.random()*6,vy:0};
  return {k,x:tx*T,y:5*T+4,w:16,h:12,vx:0.7*sp,ox:tx*T,oy:5*T+4,alive:true,st:'walk',ft:0,ph:Math.random()*6,vy:0};
}

/* ---------------- world helpers ---------------- */
const tileAt=(tx,ty)=>(tx<0||tx>=LV.W)?'#':(ty<0||ty>=LV.H)?' ':LV.t[ty][tx];
const solid=c=>c==='#'||c==='G'||c==='W';
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function moveX(e,dx){
  e.x+=dx; const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solid(tileAt(tx,ty))){ if(dx>0) e.x=tx*T-e.w; else if(dx<0) e.x=(tx+1)*T; e.vx=0; return true; }
  return false;
}
function moveY(e,dy){
  const prevBottom=e.y+e.h; e.y+=dy; e.ground=false;
  const x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.01)/T), y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);
    if(solid(c)){ if(dy>0){ e.y=ty*T-e.h; e.ground=true; } else if(dy<0){ e.y=(ty+1)*T; } e.vy=0; }
    else if(c==='='&&dy>0&&prevBottom<=ty*T+0.01){ e.y=ty*T-e.h; e.vy=0; e.ground=true; }
  }

function burst(x,y,n,colors,spd=2,life=36,gr=0.08){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*spd; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life*(0.6+Math.random()*0.6),c:pick(colors),g:gr}); } }
const float=(x,y,s,c='#FFE14D')=>texts.push({x,y,s,life:55,c});
const CONFETTI=['#E53935','#1E88E5','#FDD835','#43A047','#FB8C00','#8E24AA','#fff'];
const BUBBLES=['#BFF6FF','#FFFFFF','#7EC8FF'];

  else if(RUN.coins>0){ const n=Math.min(3,RUN.coins); RUN.coins-=n; float(P.x,P.y-14,'-'+n+' 🪙','#fff'); }
}
function respawn(msg){

function hurt(srcX,push){

  P.vx=(P.x+P.w/2<srcX)?-(push||2.6):(push||2.6); P.vy=-3; P.inv=80; sfx('bump'); P.mover=null;
  if(AG.hearts){ P.hp--; float(P.x,P.y-6,'OUCH!','#fff'); if(P.hp<=0){ P.hp=AG.hearts; lose(); respawn('OUT OF HEARTS! BACK TO THE FLAG'); } }

/* ---------------- update ---------------- */
function updMovers(){
  const sp=LEVELS[lvl].mover||0.01;
  for(const m of LV.movers){ const ox=m.x; m.ph+=sp; m.x=m.x0+(m.x1-m.x0)*(0.5-0.5*Math.cos(m.ph)); m.dx=m.x-ox; }
}
function updPlayer(){

  // riding a raft
  if(P.mover){ moveX(P,P.mover.dx); }
  P.fallV=P.vy;
  moveX(P,P.vx); const prevBottom=moveY(P,P.vy);

  P.wasGround=P.ground; P.sx+=(1-P.sx)*0.2; P.sy+=(1-P.sy)*0.2;

  for(const s of LV.springs){ if(s.squash>0) s.squash--; if(P.vy>=0&&P.x+P.w>s.x&&P.x<s.x+s.w&&P.y+P.h>=s.y-2&&P.y+P.h<=s.y+8){ P.vy=-8.2; P.ground=false; P.dbl=false; s.squash=10; sfx('spring'); P.sy=1.35; P.sx=0.7; } }
  for(const f of LV.flags) if(!f.on&&P.x+P.w>f.x&&P.x<f.x+14){ f.on=true; P.spawnX=f.x; burst(f.x+8,LV.top*T-24,10,CONFETTI,1.5); sfx('flag'); toast={msg:'CHECKPOINT!',until:t+60}; for(const o of LV.flags) if(o!==f&&o.x<f.x) o.on=true; }

    if(overlap(P,c)){ if(P.vy>0.5&&P.y+P.h-c.y<11){ c.st='flee'; c.ft=0; P.vy=-5.5; P.ground=false; P.dbl=false; sfx('bop'); float(c.x,c.y-8,'BOP!'); burst(c.x+c.w/2,c.y+4,14,BUBBLES,2); } else hurt(c.x+c.w/2); } }

const dust=()=>{ const th=THEMES[LEVELS[lvl].theme]; for(let i=0;i<6;i++) parts.push({x:P.x+5+rnd(-6,6),y:P.y+P.h-1,vx:rnd(-1,1),vy:rnd(-0.8,-0.2),life:18,c:pick([th.grass,'#fff',th.ground]),g:0.02}); };
function updCrits(){
  for(const c of LV.crits){
    if(!c.alive) continue;
    if(c.st==='flee'){ c.ft++; c.y-=1.2; if(c.ft>40) c.alive=false; continue; }
    if(c.k==='jelly'){ c.y=c.oy+Math.sin(t*0.035+c.ph)*22*Math.min(1.2,AG.spd+0.2); continue; }
    if(c.k==='puffer'){ c.x+=c.vx; if(Math.abs(c.x-c.ox)>4*T) c.vx=-c.vx; c.y=c.oy+Math.sin(t*0.05+c.ph)*6; continue; }
    c.x+=c.vx; const fx=c.vx>0?c.x+c.w+1:c.x-1, tx=Math.floor(fx/T);
    const wall=solid(tileAt(tx,Math.floor((c.y+c.h-2)/T))), below=tileAt(tx,Math.floor((c.y+c.h+2)/T)), edge=!(solid(below)||below==='=');
    if(wall||edge||Math.abs(c.x-c.ox)>4*T) c.vx=-c.vx;
  }
}
/* The Big Octopus. One eye is blind and crossed out with an X.
   He bobs up and down, sweeps a long tentacle along the sand and lobs ink.
   Bounce on his head to make him give up. */
function octoHead(B){ return {x:B.x-30,y:B.base-62+B.bob,w:60,h:46}; }

    B.hp--; B.inv=80; P.vy=-7; P.inv=45; P.vx=-1.6; P.ground=false; P.dbl=false; sfx('bop'); shake=12; float(h.x+16,h.y-12,'BOING!'); burst(h.x+30,h.y+4,20,['#a78bfa','#fff','#7c3aed'],2.2);
    if(B.hp<=0){ B.state='calm'; B.sweep=0; B.sweepLen=0; B.ink=[]; const L=LEVELS[lvl];

      for(let k=0;k<5;k++) LV.drops.push({x:B.x-20+k*9,y:h.y,vx:rnd(-1.6,0.4),vy:rnd(-4,-2),w:10,h:12,got:false,ready:false,gem:true,c:k%5});

let gateQ=null;

  $('#qtext').textContent=q.q; const ph=picHTML(q.pic); $('#qpic').innerHTML=ph; $('#qpic').style.display=ph?'':'none'; $('#qpic').classList.toggle('small',!!(q.pic&&q.pic.rows));

function readQ(){ if(!gateQ) return; const q=gateQ.q, txt=(q.say||q.q).replace(/___/g,'blank').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/−/g,' minus ').replace(/²/g,' squared ');

  drawBG(th,ox); drawTiles(th,ox); drawEnts(ox); drawHUD();
  if(banner){ const lines=wrapTxt(banner.txt,Math.floor((VW-40)/6.5)), h=10+lines.length*10; rect('#000',10,20,VW-20,h+4); rect('#FFF6DC',12,22,VW-24,h); lines.forEach((l,i)=>post.push(()=>txt(l,VW/2,27+i*10,6.5,'#3A2A5A','center',false))); }
  if(toast){ if(t>toast.until) toast=null; else post.push(()=>txt(toast.msg,VW/2,PH-22,7,'#FFE14D','center')); }
  if(state==='chest') post.push(()=>{ txt('TREASURE!',VW/2,40,16,'#FFE14D','center'); });
  cx.imageSmoothingEnabled=false; cx.drawImage(lo,0,0,cv.width,cv.height); for(const f of post) f(); post.length=0;
}
function resize(){
  const W=innerWidth, H=innerHeight, aspect=W/Math.max(1,H);
  VW=clamp(Math.round(VH*aspect/2)*2,300,460); lo.width=VW; lo.height=VH; g=lo.getContext('2d'); g.imageSmoothingEnabled=false;
  let cw=W, ch=cw*VH/VW; if(ch>H){ ch=H; cw=ch*VW/VH; }
  cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const dpr=Math.min(3,window.devicePixelRatio||1); cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); SC=cv.height/VH;
}
addEventListener('resize',resize); resize();
let acc=0, last=performance.now();
function frame(now){
  acc+=Math.min(100,now-last); last=now;
  try{ if(window.__AQmanual) acc=0; else while(acc>=1000/60){ step(); acc-=1000/60; } }catch(err){ acc=0; hit.clear(); console.error(err); }
  try{ draw(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
refreshTitle();
// test hook for automated play-testing (harmless in normal play)
window.__AQ={GEN,AGES,LEVELS,HEROES,question,get A(){return A;},set A(v){A=v;},S,save,newAdventure,startRun,finishRun,showTurn,get state(){return state;},set state(v){state=v;},P,get LV(){return LV;},step,draw,down,hit,
  get RUN(){return RUN;},answer,closeGate,get gateQ(){return gateQ;},octoHead,get camX(){return camX;},show,renderSetup,loadLevel,get VW(){return VW;},score};
requestAnimationFrame(frame);
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
